<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Wisconsin Effigy Mounds | Spatial Analysis</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
</head>
<body>
    <header class="main-header">
        <div class="brand">
            <h1>Effigy Mound Explorer</h1>
        </div>
        <div id="global-stats">Total Sites: <strong id="stat-count">0</strong></div>
    </header>

    <div class="dashboard">
        <aside class="sidebar">
            <div class="card" id="info-card">
                <h2>Site Analysis</h2>
                <div id="detail-content">
                    <p class="hint">Select a mound on the map to view archaeological data and effigy counts.</p>
                </div>
            </div>

            <div class="card">
                <h3>Analysis Layers</h3>
                <div class="layer-control">
                    <div class="layer-item">
                        <div class="layer-item">
                            <div class="layer-header">
                                <input type="checkbox" id="layer-nick" checked>
                                <label for="layer-nick">Vegetation (Nick)</label>
                            </div>
                        </div>
                    </div>
                    <div class="layer-item">
                        <div class="layer-header">
                            <input type="checkbox" id="layer-chan-lca" checked>
                            <label for="layer-chan-lca">Least Cost Analysis (Chanodom)</label>
                        </div>  
                    </div>
                    <div class="layer-item">
                        <div class="layer-header">
                            <input type="checkbox" id="layer-chan-catch" checked>
                            <label for="layer-chan-catch">Clan Catchments (Chanodom)</label>
                        </div>
                    </div>
                    <div class="layer-item layer-param-group">
                        <div class="layer-header">
                            <input type="checkbox" id="layer-param" checked>
                            <label for="layer-param">Proportional Aggregates (Param)</label>
                        </div>

                        <div class="layer-subcontrol" id="param-subcontrol">
                            <select id="param-aggregate-select">
                                <option value="">Select aggregation...</option>
                                <option value="huc8">Sub-basin</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="map-workspace">
            <div id="map-container"></div>
        </main>
    </div>

    <div id="popup" class="popup hidden">
        <div class="popup-header">
            <span id="popup-title"></span>
            <button id="popup-close">✕</button>
        </div>
        <div id="popup-chart"></div>
    </div>

    <div id="pie-tooltip" class="pie-tooltip hidden"></div>

    <script src="js/main.js"></script>
</body>
</html>
